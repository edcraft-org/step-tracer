name: browser-wheel

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-browser-wheel:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Verify pure Python wheel
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheels = sorted(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected exactly one wheel, found {len(wheels)}")

          wheel_path = wheels[0]
          if "py3-none-any" not in wheel_path.name:
              raise SystemExit(f"Expected a pure Python wheel, got {wheel_path.name}")

          with zipfile.ZipFile(wheel_path) as archive:
              wheel_metadata = next(
                  name for name in archive.namelist() if name.endswith(".dist-info/WHEEL")
              )
              metadata = archive.read(wheel_metadata).decode("utf-8")
              if "Root-Is-Purelib: true" not in metadata:
                  raise SystemExit("Wheel is not marked as purelib.")
          PY

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: step-tracer-browser-wheel
          path: dist/*.whl

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
